[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clasificador-de-audios"
version = "0.1.0"
description = "Clasificación de voces (masculina / femenina) a partir de la frecuencia fundamental"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
]

[project.optional-dependencies]
microfono = ["sounddevice"]
graficas = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools]
packages = ["src"]
